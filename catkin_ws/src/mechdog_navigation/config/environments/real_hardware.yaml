# Environment-Specific Configuration: REAL HARDWARE
# Physical MechDog with HC-SR04 ultrasonic + Hiwonder API

environment:
  name: "real_hardware"
  type: "physical"

  topic_remapping:
    scan_input: "/mechdog/scan"
    odom_input: "/mechdog/odom"

  velocity:
    max_linear: 0.3
    max_angular: 0.5

  sensors:
    ultrasonic:
      max_range: 3.0
      min_range: 0.02
      fov: 0.26
      noise_level: "real"

  planning:
    global_replan_distance: 0.2
    local_planning_frequency: 20.0

  safety:
    critical_distance: 0.30
    warning_distance: 0.60

  compute:
    max_planning_time: 0.5
    high_frequency_mode: false

  debug:
    visualize_plans: true
    publish_debug_markers: false
    log_level: "info"
