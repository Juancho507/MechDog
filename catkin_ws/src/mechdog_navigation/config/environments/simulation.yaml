# Environment-Specific Configuration: SIMULATION
# HC-SR04 ultrasonic range sensor (single forward beam, 3.0 m max)

environment:
  name: "simulation"
  type: "virtual"

  topic_remapping:
    scan_input: "/mechdog/scan"
    odom_input: "/mechdog/odom"

  velocity:
    max_linear: 0.5
    max_angular: 0.8

  sensors:
    ultrasonic:
      max_range: 3.0
      min_range: 0.02
      fov: 0.26
      noise_level: "low"

  planning:
    global_replan_distance: 0.3
    local_planning_frequency: 20.0

  safety:
    critical_distance: 0.25
    warning_distance: 0.50

  compute:
    max_planning_time: 0.2
    high_frequency_mode: true

  debug:
    visualize_plans: true
    publish_debug_markers: true
    log_level: "debug"
