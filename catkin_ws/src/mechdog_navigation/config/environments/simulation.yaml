# Environment-Specific Configuration: SIMULATION
# Overrides for simulated environment (Gazebo/PyBullet)

environment:
  name: "simulation"
  type: "virtual"
  
  # Sensor topic remapping (if needed)
  topic_remapping:
    # Map simulation topics to standard navigation topics
    scan_input: "/mechdog/scan"  # From noise_injector in mechdog_sim
    odom_input: "/mechdog/odom"  # From noise_injector in mechdog_sim
    
  # Velocity limits (can be more aggressive in simulation)
  velocity:
    max_linear: 1.2  # m/s (slightly higher for testing)
    max_angular: 1.8  # rad/s
    
  # Sensor characteristics
  sensors:
    lidar:
      max_range: 10.0  # meters
      min_range: 0.10  # meters
      noise_level: "medium"  # Expected noise from noise_injector
      
  # Planning aggressiveness
  planning:
    global_replan_distance: 0.3  # meters (replan more frequently)
    local_planning_frequency: 20.0  # Hz
    
  # Safety distances account for the robot's own leg geometry.
  # The front legs appear at ~0.13-0.15m in the LIDAR scan, so
  # critical_distance must be below that to avoid self-triggered stops.
  safety:
    critical_distance: 0.20  # meters — robot footprint radius ~0.18m
    warning_distance: 0.35  # meters
    
  # Computational resources
  compute:
    max_planning_time: 0.2  # seconds (more time available)
    high_frequency_mode: true
    
  # Debugging
  debug:
    visualize_plans: true
    publish_debug_markers: true
    log_level: "debug"
