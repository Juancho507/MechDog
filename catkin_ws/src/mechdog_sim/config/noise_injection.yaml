# Noise Injection Configuration for Sim-to-Real Gap Mitigation
# Injects artificial noise to emulate HC-SR04 ultrasonic imperfections

noise_injection:
  # Ultrasonic range sensor noise (HC-SR04)
  ultrasonic:
    enabled: true
    gaussian_noise:
      mean: 0.0
      stddev: 0.01  # meters (1cm)
    outlier_probability: 0.01  # 1% chance of spurious reading
    outlier_range:
      min: 0.5
      max: 3.0
    dropout_probability: 0.02  # 2% chance of max-range reading (no echo)

  # Odometry noise (wheel slippage, friction)
  odometry:
    enabled: false
    position_noise:
      x:
        mean: 0.0
        stddev: 0.005
      y:
        mean: 0.0
        stddev: 0.005
      theta:
        mean: 0.0
        stddev: 0.01
    velocity_noise:
      linear:
        mean: 0.0
        stddev: 0.02
      angular:
        mean: 0.0
        stddev: 0.05
    drift:
      linear: 0.001
      angular: 0.002
