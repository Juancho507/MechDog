# Escenarios de obstaculos para experimentos
# Cada escenario define objetos dispersos que el robot debe esquivar
# NO son laberintos - son campos abiertos con obstaculos

scenarios:

  simple:
    description: "3 obstaculos - escenario basico para validacion"
    map_size: [10, 10]
    robot_spawn: [0.0, 0.0, 0.0]
    home_base: [0.0, 0.0]
    goals:
      - [8.0, 0.0]
    obstacles:
      - type: box
        pose: [3.0, 0.8, 0.15, 0, 0, 0]
        size: [0.4, 0.4, 0.3]
        color: "Gazebo/Red"
      - type: cylinder
        pose: [5.0, -0.6, 0.2, 0, 0, 0]
        radius: 0.2
        length: 0.4
        color: "Gazebo/Blue"
      - type: box
        pose: [7.0, 0.4, 0.15, 0, 0, 0.3]
        size: [0.3, 0.5, 0.3]
        color: "Gazebo/Green"

  medium:
