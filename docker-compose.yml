services:

  # ========================================================================
  # ROS NOETIC SERVICES (Multi-Stage Build Architecture)
  # All services communicate over the internal mechdog_net bridge network.
  # DNS resolution uses service names (e.g. http://roscore:11311).
  # ========================================================================

  # Base ROS service — Interactive development (builder stage, no GUI)
  mechdog:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./catkin_ws:/app/catkin_ws
    environment:
      - ROS_HOSTNAME=mechdog
      - ROS_MASTER_URI=http://roscore:11311
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    networks:
      - mechdog_net
    depends_on:
      - roscore

  # Web-based visualization service (Gazebo + RViz via noVNC)
  # Access: http://localhost:6080/vnc.html
  mechdog_viz:
    build:
      context: .
      dockerfile: Dockerfile
      target: visualizer
    volumes:
      - ./catkin_ws:/app/catkin_ws
    environment:
      - DISPLAY=:0
      - RESOLUTION=1920x1080
      - ROS_HOSTNAME=mechdog_viz
      - ROS_MASTER_URI=http://roscore:11311
      - PYTHONUNBUFFERED=1
      # Software rendering (no GPU passthrough needed)
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - GAZEBO_HEADLESS=1
    stdin_open: true
    tty: true
    ports:
      - "6080:6080"       # noVNC web access: http://localhost:6080/vnc.html
    entrypoint: ["/start_vnc.sh"]
    command: bash
    networks:
      - mechdog_net
    depends_on:
      - roscore

  # ROS Master (roscore)
  roscore:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - ROS_HOSTNAME=roscore
      - ROS_MASTER_URI=http://roscore:11311
    networks:
      - mechdog_net
    command: roscore

  # Gazebo Simulation
  simulation:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./catkin_ws:/app/catkin_ws
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_HOSTNAME=simulation
      - ROS_MASTER_URI=http://roscore:11311
      - GAZEBO_MODEL_PATH=/app/catkin_ws/src/mechdog_sim/models
    networks:
      - mechdog_net
    depends_on:
      - roscore
    command: >
      bash -c "source /app/catkin_ws/devel/setup.bash &&
               roslaunch mechdog_sim simulation.launch"

  # Navigation Stack
  navigation:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./catkin_ws:/app/catkin_ws
    environment:
      - ROS_HOSTNAME=navigation
      - ROS_MASTER_URI=http://roscore:11311
      - PYTHONUNBUFFERED=1
    networks:
      - mechdog_net
    depends_on:
      - roscore
    command: >
      bash -c "source /app/catkin_ws/devel/setup.bash &&
               roslaunch mechdog_navigation navigation.launch environment:=simulation"

  # Websocket Telemetry Bridge for Native Visualization (Foxglove Studio)
  # Access: ws://localhost:9090
  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./catkin_ws:/app/catkin_ws
    networks:
      - mechdog_net
    environment:
      - ROS_HOSTNAME=telemetry
      - ROS_MASTER_URI=http://roscore:11311
      - PYTHONUNBUFFERED=1
    ports:
      - "9090:9090"
    depends_on:
      - roscore
    command: >
      bash -c "chmod +x /app/catkin_ws/entrypoint_telemetry.sh &&
               exec /app/catkin_ws/entrypoint_telemetry.sh"

  # RViz Visualization (deprecated — use mechdog_viz instead)
  # Kept for backward compatibility; requires X11 forwarding on the host.
  rviz:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./catkin_ws:/app/catkin_ws
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_HOSTNAME=rviz
      - ROS_MASTER_URI=http://roscore:11311
    networks:
      - mechdog_net
    depends_on:
      - roscore
    profiles:
      - legacy
    command: >
      bash -c "source /app/catkin_ws/devel/setup.bash &&
               roslaunch mechdog_description display.launch"

  # ========================================================================
  # LEGACY SERVICES (PyBullet — Old Architecture)
  # ========================================================================

  solver:
    build:
      context: .
      dockerfile: Dockerfile.pybullet
    entrypoint: python -m exploration.solver
    volumes:
      - ./maps:/app/maps
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - legacy

  visualize:
    build:
      context: .
      dockerfile: Dockerfile.pybullet
    command: /start_vnc.sh
    volumes:
      - ./maps:/app/maps
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "6081:6080"
    profiles:
      - legacy

  train:
    build:
      context: .
      dockerfile: Dockerfile.pybullet
    command: python main.py
    volumes:
      - ./maps:/app/maps
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - legacy


# =========================================================================
# Networks
# =========================================================================

networks:
  mechdog_net:
    driver: bridge
